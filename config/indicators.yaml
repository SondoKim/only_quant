# ───────────────────────────────────────────────────────────────────────────
# 금리 팩터 북 (SleeveEngine, src/sleeves/sleeve_engine.py) 운용 설정 — 단일 출처.
# 백테스트 scripts/run_sleeve_backtest.py · 대시보드 strategy_dashboard.py · 감사
# audit_lookahead.py · PM(portfolio_management) 배정자본이 모두 이 파일을 읽는다.
#
# 2026-10-13 정리: 기각·영구 OFF 실험(리버전 서브북, 레짐 게이트, 커브 트레이드, 블록 예산,
# 매크로·커브 슬리브, 스위칭 토글)의 설정과 엔진 코드를 제거했다. 근거·수치는 메모리와
# git tag `pre-engine-cleanup-2026-10` 에 있다. ⚠ 같은 표본에서 수십 개 변형을 시험해 왔으므로
# 여기 숫자를 '더 좋은 값'으로 바꾸는 재튜닝은 하지 말 것 (사전등록 + 홀드아웃 규율).
# ───────────────────────────────────────────────────────────────────────────
sleeves:
  # ── 북 규모·한도 (단일 출처) ───────────────────────────────────────────
  # 배정자본: 포지션 1.0 = 이 금액(억원)의 선물 명목. PM pm_config.UNIT_KRW['FACTOR_RATES']
  # 도 이 값을 읽는다 (PM 배분 배수는 그 위에 곱해진다).
  capital_억: 500
  # DV01 한도 (만원/bp, 배정자본 기준 = PM 배분 배수 적용 전). 엔진이 finalize 마지막에 강제:
  # 순 |Σ DV01| > net 또는 Σ|DV01| > gross 인 날은 금리 포지션 전체를 비례 축소. DV01 = 포지션 ×
  # |β_t| × 배정자본, β = 선물 5일 수익률을 테너 금리 5일 bp 변화에 회귀(250일 롤링, 그날까지).
  # 2026-10-13 도입 — 2012+ 축소 9.1% 일, SR 0.570→0.587 (제약이라 성과와 무관하게 채택).
  # 2026-10-14 사용자 결정: β 를 5일 단위 회귀로 통일 (일간 회귀는 美 금리 스냅샷이 CBOT 정산보다
  # 늦어 TU·TY 를 8~10% 과소). 같은 β 를 대시보드·라이브 기록·PM 계약당 DV01 이 함께 쓴다
  # (data/rates_signal_table.json 'durations' = |β|×1e4 → PM positions.dv01_contract_live).
  # 5일 β 단독 영향: 축소일 9.1→9.6%, SR 불변(0.583). FDTR 중간값(assets.yaml)과 합친 최종:
  # 2012+ SR 0.569 · 2016+ 0.617 · 2022+ 0.880, 축소 9.5% 일.
  dv01_limit:
    net: 5000
    gross: 8000
    beta_lookback: 250
    beta_horizon: 5

  # ── 유니버스 ───────────────────────────────────────────────────────────
  # exclude_assets: 유니버스에서 완전 제외 (2026-07-14/07-22 A/B, 유로존 4종 — 내부상관 0.65
  # 한 덩어리, 매매 시 손해). ⚠ 더 깎지 말 것: 12→8 이미 선택편의 누적.
  exclude_assets:
    - DU1 Comdty    # 독일 2Y (Schatz)
    - RX1 Comdty    # 독일 10Y (Bund)
    - OAT1 Comdty   # 프랑스 10Y
    - IK1 Comdty    # 이탈리아 10Y (BTP)
  # signal_only_assets: 시그널·횡단면 기준선에는 참여, 매매만 0 (2026-07-22 — 한국 소재
  # 운용자의 집행 시간 제약. 시그널 8종 유지가 핵심: 4종으로 좁히면 성과 악화).
  # ⚠ 실효 독립 베팅은 사실상 '미국 듀레이션 + 한국 듀레이션' 2개 (ρ TU·TY 0.78, KE·KAA 0.87).
  signal_only_assets:
    - G 1 Comdty    # 영국 Gilt
    - JB1 Comdty    # 일본 JGB
    - YM1 Comdty    # 호주 3Y (ASX, 100−금리 호가)
    - XM1 Comdty    # 호주 10Y (ASX, 100−금리 호가)
  # 팩터 차트(sleeve_factor_signals.csv) 범위: signal = 시그널 8종 + 관찰 전용 분트.
  factor_monitor_scope: signal
  factor_monitor_extra:
    - RX1 Comdty    # 독일 10Y — 관찰 전용 (시그널·매매 무관)

  # ── 데이터·손익 기준 (2026-10-02 감사) ─────────────────────────────────
  # roll_adjust: 금리 연속선물을 실제 월물 교체일(FUT_CUR_GEN_TICKER) 기준 ratio back-adjust.
  # pnl_basis: futures = 롤 보정 선물 수익률(실계좌 손익). yield_implied 는 비교용(캐리 누락).
  roll_adjust: true
  pnl_basis: futures

  # ── 슬리브 ─────────────────────────────────────────────────────────────
  # trend = 6/12개월 TSMOM, value = 2년 평균회귀, carry = 국가간 환헤지 캐리,
  # policy = 자국 2Y/3Y 6개월 변화(인하 사이클 롱). 가중 균등.
  # 2026-10-13 재검증 (scripts/research/test_composition_2026_10.py, 사전등록, 2012+ 패널,
  # 교정 캐리): 4슬리브 A 개발 0.41/홀드 0.89/전체 0.57 · 밸류 제외 0.31/0.89 · 캐리 제외
  # 0.50/0.75 · 추세+정책 0.47/0.73 → 규칙('잡음 0.10 내 최소 슬리브')상 4슬리브 유지.
  sleeve_weights:
    trend: 1.0
    value: 1.0
    carry: 1.0
    policy: 1.0
  # carry_method: hedged_xs = (테너금리 − 자국 정책금리) ÷ 채권 위험, 국가간 레벨 비교.
  # 채권 위험 = 선물 실현볼, 단 ASX(assets.yaml yield_quoted_futures)는 par 듀레이션 × 금리볼.
  carry_method: hedged_xs
  # 횡단면 중립화 (1 = 시장중립 상대가치, 0 = 방향성). trend/policy 중립화는 2026-07-23
  # A/B 에서 전 격자 단조 악화 → 이 북의 알파는 방향성 CTA 프리미엄.
  xs_neutralize:
    trend: 0.0
    value: 1.0
    carry: 1.0
  fx_carry_source: yield    # FX 북(모니터링 전용) 캐리 = 2Y 금리차
  trend_horizons: [126, 252]
  trend_z_window: 252
  value_window: 504
  carry_window: 252
  policy_period: 126
  signal_clip: 3.0
  signal_smooth_span: 5     # 컨빅션 EWMA span
  position_smooth: 0.8      # 최종 포지션 EWMA (전일 비중 0.8 — 회전 절반)

  # ── 리스크 ─────────────────────────────────────────────────────────────
  vol_halflife: 33          # 실현볼 EWMA 반감기 (인버스볼 사이징)
  target_asset_vol: 0.10    # 자산당 위험 (인버스볼)
  max_asset_pos: 3.0        # 볼타겟 전 자산 포지션 상한 (⚠ TU·KE 는 자주 포화 — 2026-10-13 감사)
  max_gross_leverage: 10.0
  port_vol_window: 63       # 포트폴리오 볼타겟 과거창
  vol_target_mode: separate # 금리/FX 북 독립 타게팅 (FX 는 모니터링 전용)
  target_port_vol: 0.10
  target_port_vol_rates: 0.071
  target_port_vol_fx: 0.071
  rates_exposure_scale: 0.5 # 금리 북 최종 노출 스케일 (2026-07-16 운용 캘리브레이션)

  # 북스톱: 스톱 전 섀도우 북의 252일 롤링 고점 대비 낙폭 → 절반/플랫 (사전등록 4/8,
  # 2026-07-22 래치 수정). 스톱 구간 대체 북 4종은 2026-10-02 전부 기각.
  # ⚠ 섀도우는 노출 스케일(×0.5) '전' 북 기준 → 실제 자본 기준으로는 약 2%/4% 낙폭에서 작동.
  # 2026-10-13: '목표 3.55%·배율 1·임계 2/4' 로 다시 쓰는 등가 재표현을 시험했으나 복리 경로
  # 차이로 임계 근처 80일의 스톱 상태가 바뀌고 SR 0.72→0.66 — 스톱이 임계값에 민감한 구조라
  # 재표현하지 않았다 (설정 숫자를 바꾸면 결과가 크게 갈릴 수 있음에 유의).
  book_stop:
    enabled: true
    dd_half: 4.0
    dd_flat: 8.0
    dd_window: 252

  # 거래비용 (명목 회전 대비 bp)
  costs_bps:
    rates: 0.5
    fx: 1.0
    index: 1.0
    KRW Curncy: 3.0
